<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160' fill='none'>
  <defs>
    <linearGradient id='goldMetallic' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#cfb53b'/>
      <stop offset='20%' stop-color='#f5e49e'/>
      <stop offset='45%' stop-color='#b8860b'/>
      <stop offset='70%' stop-color='#faedb8'/>
      <stop offset='100%' stop-color='#8c6914'/>
    </linearGradient>
    <filter id='goldShine' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='1' stdDeviation='1.2' flood-color='#4a3300' flood-opacity='0.3'/>
    </filter>
</defs>
  <g stroke='url(#goldMetallic)' fill='none' stroke-width='1.5' filter='url(#goldShine)'>
    <!-- Corner L lines -->
    <path d='M10,150 L10,10 L150,10' stroke-width='2'/>
    <path d='M18,135 L18,18 L135,18' stroke-width='1'/>
    <!-- Flourish scroll -->
    <path d='M25,25 Q55,25 70,45 Q85,65 110,65 Q135,65 145,50' stroke-linecap='round'/>
    <path d='M25,25 Q25,55 45,70 Q65,85 65,110 Q65,135 50,145' stroke-linecap='round'/>
    <path d='M40,40 Q70,40 85,60' stroke-linecap='round'/>
    <path d='M40,40 Q40,70 60,85' stroke-linecap='round'/>
    <!-- Center fleur -->
    <circle cx='35' cy='35' r='4' fill='url(#goldMetallic)'/>
    <circle cx='70' cy='45' r='2.5' fill='url(#goldMetallic)'/>
    <circle cx='45' cy='70' r='2.5' fill='url(#goldMetallic)'/>
  </g>
</svg>