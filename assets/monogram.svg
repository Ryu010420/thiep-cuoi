<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160' fill='none'>
  <defs>
    <linearGradient id='goldGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#c29b38'/>
      <stop offset='25%' stop-color='#e6ca65'/>
      <stop offset='50%' stop-color='#b58728'/>
      <stop offset='75%' stop-color='#fae588'/>
      <stop offset='100%' stop-color='#9a6e18'/>
    </linearGradient>
    <filter id='goldGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='1' stdDeviation='1' flood-color='#735210' flood-opacity='0.25'/>
    </filter>
</defs>
  <circle cx='80' cy='80' r='68' stroke='url(#goldGrad)' stroke-width='2' stroke-dasharray='4,3' filter='url(#goldGlow)'/>
  <circle cx='80' cy='80' r='74' stroke='url(#goldGrad)' stroke-width='1' filter='url(#goldGlow)'/>
  <!-- Wreath leaves around monogram -->
  <path d='M30,80 C30,50 50,30 80,30' stroke='url(#goldGrad)' stroke-width='1.5' stroke-linecap='round'/>
  <path d='M130,80 C130,50 110,30 80,30' stroke='url(#goldGrad)' stroke-width='1.5' stroke-linecap='round'/>
  <path d='M30,80 C30,110 50,130 80,130' stroke='url(#goldGrad)' stroke-width='1.5' stroke-linecap='round'/>
  <path d='M130,80 C130,110 110,130 80,130' stroke='url(#goldGrad)' stroke-width='1.5' stroke-linecap='round'/>
  <!-- Leaves -->
  <circle cx='40' cy='55' r='4' fill='url(#goldGrad)'/>
  <circle cx='120' cy='55' r='4' fill='url(#goldGrad)'/>
  <circle cx='40' cy='105' r='4' fill='url(#goldGrad)'/>
  <circle cx='120' cy='105' r='4' fill='url(#goldGrad)'/>
</svg>