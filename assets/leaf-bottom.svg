<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 400' fill='none'>
  <defs>
    <linearGradient id='goldGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#c29b38'/>
      <stop offset='25%' stop-color='#e6ca65'/>
      <stop offset='50%' stop-color='#b58728'/>
      <stop offset='75%' stop-color='#fae588'/>
      <stop offset='100%' stop-color='#9a6e18'/>
    </linearGradient>
    <filter id='goldGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='1' stdDeviation='1' flood-color='#735210' flood-opacity='0.25'/>
    </filter>
</defs>
  <g filter='url(#goldGlow)' stroke='url(#goldGrad)' fill='none'>
    <!-- Main stem curving up and left -->
    <path d='M280,390 C260,330 230,240 180,160 C140,100 80,50 10,20' stroke-width='3.2' stroke-linecap='round'/>
    <path d='M300,340 C280,270 235,190 190,130 C150,80 100,40 40,10' stroke-width='2' stroke-linecap='round'/>
    <path d='M235,260 C190,240 150,245 120,260' stroke-width='1.8' stroke-linecap='round'/>
    <path d='M195,180 C155,160 125,170 100,190' stroke-width='1.8' stroke-linecap='round'/>
    <path d='M135,110 C105,95 80,105 60,120' stroke-width='1.8' stroke-linecap='round'/>
  </g>
  <g filter='url(#goldGlow)' stroke='url(#goldGrad)' stroke-width='2' fill='none'>
    <!-- Leaf clusters -->
    <path d='M245,310 C215,290 205,315 215,340 C225,360 255,345 245,310 Z' fill='url(#goldGrad)' fill-opacity='0.08'/>
    <path d='M210,240 C175,225 165,250 178,275 C190,295 220,275 210,240 Z' fill='url(#goldGrad)' fill-opacity='0.08'/>
    <path d='M175,170 C140,150 130,175 142,200 C155,220 185,200 175,170 Z' fill='url(#goldGrad)' fill-opacity='0.08'/>
    <path d='M125,100 C95,85 85,110 98,130 C110,150 135,130 125,100 Z' fill='url(#goldGrad)' fill-opacity='0.08'/>
    <path d='M75,50 C45,35 35,60 48,80 C60,100 85,80 75,50 Z' fill='url(#goldGrad)' fill-opacity='0.08'/>
    <path d='M20,15 C-5,5 -10,30 2,45 C15,60 35,40 20,15 Z' fill='url(#goldGrad)' fill-opacity='0.08'/>

    <!-- Outer graceful leaves -->
    <path d='M240,210 C255,180 280,195 275,220 C270,240 245,235 240,210 Z' fill='url(#goldGrad)' fill-opacity='0.06'/>
    <path d='M195,130 C210,105 235,120 230,140 C225,160 200,155 195,130 Z' fill='url(#goldGrad)' fill-opacity='0.06'/>
    <path d='M145,65 C160,45 180,60 175,78 C170,95 150,90 145,65 Z' fill='url(#goldGrad)' fill-opacity='0.06'/>
    <path d='M90,20 C105,5 125,18 120,35 C115,50 95,45 90,20 Z' fill='url(#goldGrad)' fill-opacity='0.06'/>
