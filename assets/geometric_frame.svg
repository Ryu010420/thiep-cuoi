<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 480' fill='none'>
  <defs>
    <linearGradient id='goldMetallic' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#cfb53b'/>
      <stop offset='20%' stop-color='#f5e49e'/>
      <stop offset='45%' stop-color='#b8860b'/>
      <stop offset='70%' stop-color='#faedb8'/>
      <stop offset='100%' stop-color='#8c6914'/>
    </linearGradient>
    <filter id='goldShine' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='1' stdDeviation='1.2' flood-color='#4a3300' flood-opacity='0.3'/>
    </filter>
</defs>
  <!-- Outer Diamond/Octagon -->
  <polygon points='200,20 380,140 380,340 200,460 20,340 20,140' stroke='url(#goldMetallic)' stroke-width='2' filter='url(#goldShine)'/>
  <!-- Inner offset rectangle -->
  <rect x='45' y='45' width='310' height='390' stroke='url(#goldMetallic)' stroke-width='1.2' stroke-dasharray='8,4' filter='url(#goldShine)'/>
  <!-- Corner accents -->
  <circle cx='200' cy='20' r='4' fill='url(#goldMetallic)'/>
  <circle cx='380' cy='140' r='3' fill='url(#goldMetallic)'/>
  <circle cx='380' cy='340' r='3' fill='url(#goldMetallic)'/>
  <circle cx='200' cy='460' r='4' fill='url(#goldMetallic)'/>
  <circle cx='20' cy='340' r='3' fill='url(#goldMetallic)'/>
  <circle cx='20' cy='140' r='3' fill='url(#goldMetallic)'/>
</svg>